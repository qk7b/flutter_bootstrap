targets:
  $default:
    builders:
      freezed:
        enabled: true
        generate_for:
          exclude:
            - test
      json_serializable:
        options:
          explicit_to_json: true
      flutter_gen_runner:
        enabled: true
        options:
          output: lib/gen/ 
          line_length: 80 
          integrations:
            flutter_svg: true
          assets:
            exclude:
              - assets/i18n/*
      # See https://pub.dev/packages/slang_build_runner#legacy-builder
      slang_build_runner:
        enabled: false
      slang_build_runner:legacy:
        enabled: true
        options:
          base_locale: en
          